<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" font-family="system-ui, -apple-system, sans-serif" role="img" viewBox="0 0 960 640"><title id="title">Workflow Runtime execution flow</title><desc id="description">One Workflow tool call executes a complete workflow run. Lifecycle and progress events remain inside the call, which returns one tool result containing launch metadata, the result, and task state.</desc><defs><marker id="arrow-green" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#22c55e" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-gray" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#888" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="960" height="640" fill="#fff" rx="8"/><text x="480" y="30" fill="#1a1a1a" font-size="19" font-weight="700" text-anchor="middle">Workflow Runtime — one Workflow call executes one complete run</text><text x="480" y="51" fill="#888" font-size="12" text-anchor="middle">lifecycle and progress events are emitted during the call; one final tool_result returns to messages[]</text><rect width="920" height="132" x="20" y="68" fill="#fff" stroke="#d0d0d0" stroke-dasharray="6 3" stroke-width="1.5" rx="8"/><text x="40" y="88" fill="#1a1a1a" font-size="13" font-weight="700">Main session loop</text><path fill="none" stroke="#22c55e" stroke-dasharray="6 3" stroke-width="1.5" marker-end="url(#arrow-green)" d="M 818 118 L 818 100 L 110 100 L 110 118"/><text x="464" y="95" fill="#22c55e" font-size="10" font-weight="600" text-anchor="middle">append one tool_result to messages[]</text><rect width="136" height="54" x="42" y="118" fill="#fff" stroke="#1a1a1a" stroke-dasharray="6 3" stroke-width="1.5" rx="6"/><text x="110" y="141" fill="#1a1a1a" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">messages[]</text><text x="110" y="159" fill="#888" font-size="9" text-anchor="middle">message history</text><line x1="178" x2="218" y1="145" y2="145" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><rect width="92" height="54" x="220" y="118" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="6"/><text x="266" y="141" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">LLM</text><text x="266" y="159" fill="#888" font-size="9" text-anchor="middle">tool_use?</text><line x1="312" x2="352" y1="145" y2="145" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><rect width="220" height="54" x="354" y="118" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="6"/><text x="464" y="140" fill="#1a1a1a" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Workflow({name, args})</text><text x="464" y="159" fill="#888" font-family="monospace" font-size="8.5" text-anchor="middle">resume_from_run_id?</text><rect width="205" height="70" x="715" y="110" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.5" rx="6"/><text x="818" y="134" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">tool_result</text><text x="818" y="153" fill="#22c55e" font-family="monospace" font-size="9.5" font-weight="600" text-anchor="middle">launched + result + task</text><text x="818" y="168" fill="#888" font-size="8.5" text-anchor="middle">one return after the run</text><rect width="920" height="350" x="20" y="232" fill="#fff" stroke="#d0d0d0" stroke-dasharray="6 3" stroke-width="1.5" rx="8"/><text x="40" y="253" fill="#1a1a1a" font-size="13" font-weight="700">WorkflowTool.call — complete workflow task lifecycle</text><rect width="180" height="76" x="45" y="272" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="6"/><text x="135" y="294" fill="#1a1a1a" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">WorkflowTool.call</text><text x="135" y="314" fill="#888" font-size="9" text-anchor="middle">validate meta · permission</text><text x="135" y="331" fill="#888" font-family="monospace" font-size="9" text-anchor="middle">runId · taskId · envelope</text><line x1="225" x2="263" y1="310" y2="310" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><rect width="180" height="76" x="265" y="272" fill="#fafafa" stroke="#d0d0d0" stroke-width="1.5" rx="6"/><text x="355" y="294" fill="#1a1a1a" font-size="11" font-weight="700" text-anchor="middle">Emit lifecycle</text><text x="355" y="314" fill="#22c55e" font-family="monospace" font-size="9.5" font-weight="600" text-anchor="middle">async_launched</text><text x="355" y="331" fill="#888" font-family="monospace" font-size="9.5" text-anchor="middle">task_started</text><line x1="445" x2="483" y1="310" y2="310" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><rect width="180" height="76" x="485" y="272" fill="#fff" stroke="#1a1a1a" stroke-dasharray="6 3" stroke-width="1.5" rx="6"/><text x="575" y="294" fill="#1a1a1a" font-size="11" font-weight="700" text-anchor="middle">Execute script</text><text x="575" y="314" fill="#888" font-family="monospace" font-size="9" text-anchor="middle">phase · agent()</text><text x="575" y="331" fill="#888" font-family="monospace" font-size="9" text-anchor="middle">parallel · pipeline</text><line x1="665" x2="703" y1="310" y2="310" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><rect width="210" height="76" x="705" y="272" fill="#fafafa" stroke="#d0d0d0" stroke-width="1.5" rx="6"/><text x="810" y="294" fill="#1a1a1a" font-size="11" font-weight="700" text-anchor="middle">Finalize task</text><text x="810" y="314" fill="#888" font-size="9" text-anchor="middle">write output · save last run</text><text x="810" y="331" fill="#22c55e" font-family="monospace" font-size="9.5" font-weight="600" text-anchor="middle">task_notification</text><line x1="575" x2="575" y1="348" y2="388" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><text x="588" y="371" fill="#22c55e" font-size="9" font-weight="600">agent()</text><rect width="190" height="64" x="475" y="390" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="6"/><text x="570" y="413" fill="#1a1a1a" font-size="11" font-weight="700" text-anchor="middle">Agent runner calls × N</text><text x="570" y="432" fill="#888" font-size="9" text-anchor="middle">schema validation · token budget</text><text x="570" y="447" fill="#888" font-size="8.5" text-anchor="middle">parallel work, structured results</text><line x1="665" x2="703" y1="422" y2="422" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><text x="684" y="414" fill="#22c55e" font-size="8.5" font-weight="600" text-anchor="middle">record</text><rect width="190" height="64" x="705" y="390" fill="#fafafa" stroke="#d0d0d0" stroke-width="1.5" rx="6"/><text x="800" y="413" fill="#1a1a1a" font-size="11" font-weight="700" text-anchor="middle">Journal</text><text x="800" y="432" fill="#888" font-family="monospace" font-size="9" text-anchor="middle">semantic key → result</text><text x="800" y="447" fill="#888" font-size="8.5" text-anchor="middle">resume returns cached calls</text><path fill="none" stroke="#888" stroke-dasharray="5 3" stroke-width="1.5" marker-end="url(#arrow-gray)" d="M 705 441 L 680 441 L 680 372 L 635 372 L 635 348"/><text x="670" y="365" fill="#888" font-size="8.5" text-anchor="end">cached</text><rect width="470" height="58" x="45" y="490" fill="#fafafa" stroke="#d0d0d0" stroke-dasharray="6 3" stroke-width="1.5" rx="6"/><text x="280" y="512" fill="#1a1a1a" font-size="10.5" font-weight="700" text-anchor="middle">Lifecycle + progress events emitted during the call</text><text x="280" y="532" fill="#888" font-family="monospace" font-size="8.8" text-anchor="middle">async_launched · task_started · workflow_phase / agent / log · task_notification</text><path fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" d="M 810 348 L 810 472 L 738 472 L 738 488"/><rect width="355" height="58" x="560" y="490" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="6"/><text x="738" y="513" fill="#1a1a1a" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">return { launched, result, task }</text><text x="738" y="532" fill="#888" font-size="9" text-anchor="middle">after task_notification</text><path fill="none" stroke="#22c55e" stroke-dasharray="6 3" stroke-width="1.5" marker-end="url(#arrow-green)" d="M 464 172 L 464 215 L 135 215 L 135 270"/><text x="250" y="209" fill="#22c55e" font-size="9" font-weight="600" text-anchor="middle">execute complete run</text><path fill="none" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)" d="M 915 519 L 934 519 L 934 211 L 818 211 L 818 180"/><text x="928" y="380" fill="#22c55e" font-size="9" font-weight="600" text-anchor="middle" transform="rotate(-90 928 380)">return once</text><text x="480" y="616" fill="#888" font-size="10" text-anchor="middle">One return boundary: async_launched is a lifecycle event; launched + result + task return together.</text></svg>