<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" viewBox="0 0 960 540"><defs><marker id="arrow-green" markerHeight="7" markerWidth="7" orient="auto" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M0 0L10 5L0 10Z"/></marker><marker id="arrow-gray" markerHeight="7" markerWidth="7" orient="auto" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#737373" d="M0 0L10 5L0 10Z"/></marker></defs><rect width="960" height="540" fill="#fff" rx="8"/><text x="480" y="32" fill="#171717" font-size="20" font-weight="700" text-anchor="middle">Goal Loop</text><text x="480" y="53" fill="#737373" font-size="11.5" text-anchor="middle">the return boundary checks the active condition before the turn can end</text><rect width="912" height="426" x="24" y="76" fill="#fff" stroke="#d4d4d4" stroke-dasharray="6 4" stroke-width="1.5" rx="8"/><text x="44" y="100" fill="#171717" font-size="13" font-weight="700">Agent session</text><rect width="142" height="58" x="52" y="150" fill="#fff" stroke="#171717" stroke-width="1.5" rx="6"/><text x="123" y="173" fill="#171717" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">messages[]</text><text x="123" y="192" fill="#737373" font-size="9" text-anchor="middle">conversation and tool results</text><line x1="194" x2="230" y1="179" y2="179" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><rect width="132" height="58" x="232" y="150" fill="#fff" stroke="#171717" stroke-width="1.5" rx="6"/><text x="298" y="173" fill="#171717" font-size="12" font-weight="700" text-anchor="middle">Worker model</text><text x="298" y="192" fill="#737373" font-size="9" text-anchor="middle">tools and actions</text><line x1="364" x2="400" y1="179" y2="179" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><rect width="132" height="58" x="402" y="150" fill="#fff" stroke="#171717" stroke-width="1.5" rx="6"/><text x="468" y="173" fill="#171717" font-size="11.5" font-weight="700" text-anchor="middle">no tool_use</text><text x="468" y="192" fill="#737373" font-size="9" text-anchor="middle">worker proposes a stop</text><line x1="534" x2="574" y1="179" y2="179" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><rect width="324" height="278" x="576" y="112" fill="#f8fdf9" stroke="#171717" stroke-width="2" rx="8"/><text x="596" y="138" fill="#171717" font-size="13" font-weight="700">Goal gate</text><text x="880" y="138" fill="#737373" font-size="9" text-anchor="end">GoalController</text><rect width="276" height="48" x="600" y="156" fill="#fff" stroke="#737373" stroke-width="1.2" rx="6"/><text x="738" y="176" fill="#171717" font-size="11.5" font-weight="700" text-anchor="middle">Stop-hook checks</text><text x="738" y="192" fill="#737373" font-size="9" text-anchor="middle">active goal · background work</text><line x1="738" x2="738" y1="204" y2="292" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/><rect width="126" height="48" x="600" y="228" fill="#fff" stroke="#a3a3a3" stroke-width="1.2" rx="6"/><text x="663" y="248" fill="#171717" font-size="10.5" font-weight="700" text-anchor="middle">Goal condition</text><text x="663" y="264" fill="#737373" font-size="8.5" text-anchor="middle">checkable end state</text><rect width="126" height="48" x="750" y="228" fill="#fff" stroke="#a3a3a3" stroke-width="1.2" rx="6"/><text x="813" y="248" fill="#171717" font-size="10.5" font-weight="700" text-anchor="middle">Conversation</text><text x="813" y="264" fill="#737373" font-size="8.5" text-anchor="middle">reported evidence</text><path fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" d="M663 276V284H700V292"/><path fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" d="M813 276V284H776V292"/><rect width="176" height="52" x="650" y="292" fill="#fff" stroke="#171717" stroke-width="1.5" rx="6"/><text x="738" y="313" fill="#171717" font-size="11.5" font-weight="700" text-anchor="middle">Evaluator</text><text x="738" y="331" fill="#737373" font-size="9" text-anchor="middle">tool-free model call</text><line x1="738" x2="738" y1="344" y2="356" stroke="#737373" stroke-width="1.5"/><path fill="#fff" stroke="#737373" stroke-width="1.3" d="M738 356L750 368L738 380L726 368Z"/><path fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" d="M726 368H650V404H516V420"/><text x="682" y="360" fill="#16a34a" font-size="9" font-weight="600" text-anchor="middle">block + reason</text><rect width="372" height="50" x="330" y="422" fill="#fff" stroke="#171717" stroke-width="1.5" rx="6"/><text x="516" y="443" fill="#171717" font-size="11.5" font-weight="700" text-anchor="middle">append the evaluator reason to messages[]</text><text x="516" y="460" fill="#737373" font-size="9" text-anchor="middle">continue in the same while loop</text><path fill="none" stroke="#16a34a" stroke-dasharray="6 4" stroke-width="1.5" marker-end="url(#arrow-green)" d="M330 447H123V208"/><path fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow-gray)" d="M750 368H841V430"/><text x="806" y="360" fill="#737373" font-size="8.5" text-anchor="middle">allow / terminal</text><rect width="146" height="40" x="768" y="432" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1.3" rx="6"/><text x="841" y="456" fill="#171717" font-size="11.5" font-weight="700" text-anchor="middle">return to user</text><text x="480" y="525" fill="#737373" font-size="10" text-anchor="middle">The evaluator is part of the gate; it reads evidence already present in the conversation and never runs tools.</text></svg>