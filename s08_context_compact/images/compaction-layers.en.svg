<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" viewBox="0 0 760 590"><defs><linearGradient id="header" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/></linearGradient><linearGradient id="pre" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/></linearGradient><linearGradient id="auto" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fecaca"/><stop offset="100%" stop-color="#fca5a5"/></linearGradient><linearGradient id="emergency" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fed7aa"/><stop offset="100%" stop-color="#fdba74"/></linearGradient><marker id="arrow-d" markerHeight="6" markerWidth="6" orient="auto" refX="5" refY="10" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 0 L 5 10 L 10 0 z"/></marker></defs><rect width="760" height="590" fill="#fafbfc" rx="8"/><rect width="760" height="44" x="0" y="0" fill="url(#header)" rx="8"/><rect width="760" height="8" x="0" y="36" fill="url(#header)"/><text x="380" y="28" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Context Compaction: Four Steps and API Error Recovery</text><rect width="220" height="80" x="20" y="62" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/><text x="130" y="82" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">Design Principles</text><text x="130" y="100" fill="#475569" font-size="10" text-anchor="middle">Run lower-cost operations first</text><text x="130" y="116" fill="#475569" font-size="10" text-anchor="middle">Preserve recoverable information</text><text x="130" y="132" fill="#475569" font-size="10" text-anchor="middle">Summarize only above the limit</text><rect width="210" height="80" x="530" y="62" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/><text x="635" y="82" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">Increasing Cost</text><text x="635" y="104" fill="#475569" font-size="10" text-anchor="middle">Structure → Summary → Recovery</text><text x="635" y="124" fill="#94a3b8" font-size="9" text-anchor="middle">0 API × 3 · 1 API · at most 1 more</text><rect width="720" height="24" x="20" y="146" fill="#f1f5f9" rx="4"/><text x="55" y="163" fill="#64748b" font-size="11" font-weight="600">Pre-processing (Step 1 → Step 2 → Step 3 before every LLM call, 0 API)</text><rect width="600" height="46" x="80" y="180" fill="url(#pre)" stroke="#2563eb" stroke-width="1.5" rx="7"/><text x="100" y="200" fill="#1e40af" font-size="12" font-weight="600">Step 1</text><text x="155" y="200" fill="#1e40af" font-size="13" font-weight="700">tool_result_budget</text><text x="315" y="200" fill="#1e40af" font-size="11">total &gt; 200,000 chars → persist largest</text><text x="650" y="200" fill="#1e40af" font-size="10" text-anchor="end">keep full content</text><text x="155" y="218" fill="#2563eb" font-size="9">Runs every turn before micro_compact can replace content</text><line x1="380" x2="380" y1="226" y2="238" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow-d)"/><rect width="600" height="46" x="80" y="240" fill="url(#pre)" stroke="#2563eb" stroke-width="1.5" rx="7"/><text x="100" y="260" fill="#1e40af" font-size="12" font-weight="600">Step 2</text><text x="155" y="260" fill="#1e40af" font-size="13" font-weight="700">snip_compact</text><text x="260" y="260" fill="#1e40af" font-size="11">messages &gt; 50 → trim middle</text><text x="650" y="260" fill="#1e40af" font-size="10" text-anchor="end">keep head/tail</text><text x="155" y="278" fill="#2563eb" font-size="9">Trims above 50 messages and preserves tool pairs</text><line x1="380" x2="380" y1="286" y2="298" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow-d)"/><rect width="600" height="46" x="80" y="300" fill="url(#pre)" stroke="#2563eb" stroke-width="1.5" rx="7"/><text x="100" y="320" fill="#1e40af" font-size="12" font-weight="600">Step 3</text><text x="155" y="320" fill="#1e40af" font-size="13" font-weight="700">micro_compact</text><text x="260" y="320" fill="#1e40af" font-size="11">old tool_result → placeholder (keep latest 3)</text><text x="650" y="320" fill="#1e40af" font-size="10" text-anchor="end">compact old</text><text x="155" y="338" fill="#2563eb" font-size="9">Runs every turn and keeps the latest 3 results complete</text><rect width="720" height="24" x="20" y="358" fill="#f1f5f9" rx="4"/><text x="70" y="375" fill="#64748b" font-size="11" font-weight="600">Auto-compact Decision (triggered when pre-processing is insufficient, 1 API call)</text><rect width="600" height="58" x="80" y="390" fill="url(#auto)" stroke="#dc2626" stroke-width="2" rx="7"/><text x="100" y="412" fill="#991b1b" font-size="12" font-weight="600">Step 4</text><text x="155" y="412" fill="#991b1b" font-size="13" font-weight="700">compact_history</text><text x="305" y="412" fill="#991b1b" font-size="11">size above 50,000 → LLM summary</text><text x="650" y="412" fill="#991b1b" font-size="10" text-anchor="end">1 API call</text><text x="155" y="428" fill="#dc2626" font-size="9">Condition: estimate_chars(messages) &gt; CONTEXT_CHAR_LIMIT</text><text x="155" y="442" fill="#dc2626" font-size="9">Save a transcript, then replace active history with one summary</text><rect width="720" height="24" x="20" y="460" fill="#f1f5f9" rx="4"/><text x="55" y="477" fill="#64748b" font-size="11" font-weight="600">Error Recovery (when the API returns prompt_too_long, at most once)</text><rect width="600" height="62" x="80" y="492" fill="url(#emergency)" stroke="#c2410c" stroke-width="1.5" rx="7"/><text x="100" y="512" fill="#9a3412" font-size="12" font-weight="600">Retry</text><text x="155" y="512" fill="#9a3412" font-size="13" font-weight="700">reactive_compact</text><text x="155" y="528" fill="#9a3412" font-size="10">Summarize older history and keep the latest 5 messages</text><text x="155" y="544" fill="#c2410c" font-size="9">Preserve tool pairs, then retry once</text></svg>