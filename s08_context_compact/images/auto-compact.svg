<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" viewBox="0 0 720 400"><defs><linearGradient id="header" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#991b1b"/><stop offset="100%" stop-color="#dc2626"/></linearGradient><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="720" height="400" fill="#fafbfc" rx="8"/><rect width="720" height="38" x="0" y="0" fill="url(#header)" rx="8"/><rect width="720" height="8" x="0" y="30" fill="url(#header)"/><text x="360" y="25" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Step 4: compact_history，生成历史摘要</text><rect width="680" height="44" x="20" y="54" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" rx="6"/><text x="35" y="70" fill="#991b1b" font-size="11" font-weight="600">触发条件</text><text x="105" y="70" fill="#991b1b" font-size="11">前三步执行后，estimate_chars(messages) &gt; CONTEXT_CHAR_LIMIT。</text><text x="105" y="86" fill="#991b1b" font-size="10">当前实现的 CONTEXT_CHAR_LIMIT 为 50,000 个字符。</text><rect width="200" height="110" x="20" y="106" fill="#fff" stroke="#94a3b8" stroke-width="1.5" rx="8"/><text x="120" y="130" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">步骤 1：保存 transcript</text><text x="40" y="152" fill="#475569" font-size="10">完整对话写入 .transcripts/</text><text x="40" y="168" fill="#475569" font-size="10">JSONL 格式，一行一条消息</text><text x="40" y="184" fill="#475569" font-size="10">文件名：transcript_{uuid}.jsonl</text><text x="40" y="200" fill="#94a3b8" font-size="9">信息没有丢失，只是移出活跃区</text><line x1="225" x2="265" y1="161" y2="161" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/><rect width="200" height="110" x="270" y="106" fill="#fff" stroke="#94a3b8" stroke-width="1.5" rx="8"/><text x="370" y="130" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">步骤 2：生成事实摘要</text><text x="370" y="152" fill="#475569" font-size="9" text-anchor="middle">原对话作为待摘要数据</text><text x="290" y="166" fill="#475569" font-size="9">摘要保留 5 类信息：</text><text x="290" y="180" fill="#94a3b8" font-size="8">目标·发现与决定·相关文件</text><text x="290" y="192" fill="#94a3b8" font-size="8">剩余工作·用户约束</text><text x="290" y="206" fill="#94a3b8" font-size="9">不提出或选择后续动作</text><line x1="475" x2="515" y1="161" y2="161" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/><rect width="180" height="110" x="520" y="106" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/><text x="610" y="130" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">步骤 3：替换历史</text><text x="610" y="152" fill="#991b1b" font-size="9" text-anchor="middle">旧历史 → 1 条压缩消息</text><text x="610" y="168" fill="#991b1b" font-size="9" text-anchor="middle">用户要求与参考状态分开</text><text x="610" y="184" fill="#991b1b" font-size="9" text-anchor="middle">system 区分指令与数据</text><text x="610" y="200" fill="#ef4444" font-size="9" text-anchor="middle">完整 transcript 保留在磁盘</text><rect width="320" height="94" x="20" y="234" fill="#fff" stroke="#94a3b8" stroke-width="1" rx="6"/><text x="180" y="256" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">压缩前 messages</text><rect width="52" height="16" x="35" y="264" fill="#e2e8f0" rx="3"/><text x="40" y="276" fill="#475569" font-size="8">user</text><rect width="52" height="16" x="92" y="264" fill="#e2e8f0" rx="3"/><text x="97" y="276" fill="#475569" font-size="8">assistant</text><rect width="52" height="16" x="149" y="264" fill="#e2e8f0" rx="3"/><text x="154" y="276" fill="#475569" font-size="8">user</text><rect width="52" height="16" x="206" y="264" fill="#e2e8f0" rx="3"/><text x="211" y="276" fill="#475569" font-size="8">assistant</text><rect width="52" height="16" x="263" y="264" fill="#e2e8f0" rx="3"/><text x="268" y="276" fill="#475569" font-size="8">user</text><text x="180" y="318" fill="#94a3b8" font-size="9" text-anchor="middle">多条消息，估算 size &gt; 50,000</text><line x1="345" x2="375" y1="281" y2="281" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/><rect width="320" height="94" x="380" y="234" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="6"/><text x="540" y="256" fill="#991b1b" font-size="11" font-weight="600" text-anchor="middle">压缩后 messages</text><rect width="290" height="32" x="395" y="264" fill="#fee2e2" stroke="#fca5a5" stroke-width=".5" rx="4"/><text x="540" y="276" fill="#991b1b" font-size="9" text-anchor="middle">当前用户要求：入口时捕获</text><text x="540" y="290" fill="#991b1b" font-size="9" text-anchor="middle">对话摘要：事实、决定与剩余工作</text><text x="540" y="318" fill="#94a3b8" font-size="9" text-anchor="middle">1 条摘要消息，显著低于阈值</text><rect width="680" height="36" x="20" y="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/><text x="35" y="362" fill="#475569" font-size="11" font-weight="600">错误后补救：</text><text x="115" y="362" fill="#475569" font-size="10">API 仍返回 prompt_too_long 时执行 reactive_compact，并且只重试 1 次。</text></svg>