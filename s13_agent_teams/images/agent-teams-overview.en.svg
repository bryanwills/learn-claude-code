 y="134" fill="#2563eb" font-size="9" font-weight="600" text-anchor="middle">spawn · send · worktree create · plan review</text><line x1="520" x2="570" y1="113" y2="113" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/><rect width="162" height="62" x="570" y="82" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="8"/><text x="651" y="105" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">Typed control</text><text x="651" y="122" fill="#a16207" font-size="8.5" text-anchor="middle">request_id · shutdown</text><text x="651" y="136" fill="#a16207" font-size="8.5" text-anchor="middle">plan approval gate</text><line x1="370" x2="370" y1="154" y2="190" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arrow-cyan)"/><line x1="651" x2="651" y1="144" y2="190" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/><rect width="640" height="44" x="60" y="190" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="22"/><text x="380" y="209" fill="#0e7490" font-size="11" font-weight="700" text-anchor="middle">MessageBus · .mailboxes/&lt;name&gt;.jsonl</text><text x="380" y="225" fill="#0f766e" font-size="8.5" text-anchor="middle">runtime delivery · ordinary messages · result · idle_notification · control events</text><line x1="118" x2="118" y1="234" y2="282" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/><line x1="348" x2="348" y1="234" y2="282" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/><line x1="578" x2="578" y1="234" y2="282" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/><line x1="182" x2="182" y1="282" y2="234" stroke="#0891b2" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#arrow-cyan)"/><line x1="412" x2="412" y1="282" y2="234" stroke="#0891b2" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#arrow-cyan)"/><line x1="642" x2="642" y1="282" y2="234" stroke="#0891b2" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#arrow-cyan)"/><rect width="220" height="82" x="40" y="282" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/><text x="150" y="305" fill="#166534" font-size="10.5" font-weight="700" text-anchor="middle">Teammate: config</text><text x="150" y="324" fill="#15803d" font-size="8.5" text-anchor="middle">independent prompt · messages · tools</text><text x="150" y="342" fill="#475569" font-size="8.5" text-anchor="middle">WORK → result → IDLE</text><text x="150" y="356" fill="#64748b" font-size="8" text-anchor="middle">direct message returns to WORK</text><rect width="220" height="82" x="270" y="282" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/><text x="380" y="305" fill="#166534" font-size="10.5" font-weight="700" text-anchor="middle">Teammate: auth</text><text x="380" y="324" fill="#15803d" font-size="8.5" text-anchor="middle">independent prompt · messages · tools</text><text x="380" y="342" fill="#475569" font-size="8.5" text-anchor="middle">WORK → result → IDLE</text><text x="380" y="356" fill="#64748b" font-size="8" text-anchor="middle">claimed task returns to WORK</text><rect width="220" height="82" x="500" y="282" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/><text x="610" y="305" fill="#166534" font-size="10.5" font-weight="700" text-anchor="middle">Teammate: tests</text><text x="610" y="324" fill="#15803d" font-size="8.5" text-anchor="middle">independent prompt · messages · tools</text><text x="610" y="342" fill="#475569" font-size="8.5" text-anchor="middle">WORK → result → IDLE</text><text x="610" y="356" fill="#64748b" font-size="8" text-anchor="middle">shutdown exits the loop</text><line x1="150" x2="150" y1="364" y2="404" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/><line x1="380" x2="380" y1="364" y2="404" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/><line x1="610" x2="610" y1="364" y2="404" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect width="640" height="54" x