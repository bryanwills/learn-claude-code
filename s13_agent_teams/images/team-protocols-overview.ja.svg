<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" viewBox="0 0 760 664"><defs><linearGradient id="header" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#555" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-purple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#7c3aed" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="760" height="664" fill="#fafbfc" rx="8"/><rect width="760" height="44" x="0" y="0" fill="url(#header)" rx="8"/><rect width="760" height="8" x="0" y="36" fill="url(#header)"/><text x="380" y="28" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Team Protocols — リクエスト・レスポンス + request_id 紐付け + 状態機械</text><rect width="12" height="10" x="40" y="56" fill="#f0f4ff" stroke="#2563eb" stroke-width="1" rx="2"/><text x="58" y="66" fill="#2563eb" font-size="10" font-weight="600">チームランタイム</text><rect width="12" height="10" x="140" y="56" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="2"/><text x="158" y="66" fill="#7c3aed" font-size="10" font-weight="600">協調プロトコル</text><rect width="70" height="40" x="20" y="90" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" rx="8"/><text x="55" y="114" fill="#4f46e5" font-size="8" font-weight="600" text-anchor="middle">turn</text><line x1="90" x2="104" y1="110" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="70" height="40" x="107" y="90" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.5" rx="8"/><text x="142" y="114" fill="#1e3a5f" font-size="10" font-weight="600" text-anchor="middle">messages</text><line x1="177" x2="191" y1="110" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="80" height="48" x="194" y="86" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.5" rx="8"/><text x="234" y="114" fill="#1e3a5f" font-size="9" font-weight="600" text-anchor="middle">prompt</text><line x1="274" x2="288" y1="110" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="70" height="48" x="291" y="86" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.5" rx="8"/><text x="326" y="114" fill="#1e3a5f" font-size="9" font-weight="600" text-anchor="middle">LLM</text><line x1="361" x2="375" y1="110" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="356" height="60" x="378" y="80" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.5" rx="8"/><text x="556" y="98" fill="#1e3a5f" font-size="10" font-weight="600" text-anchor="middle">TOOL DISPATCH（コアツールセット）</text><text x="394" y="114" fill="#2563eb" font-size="8">base(5) · task(5) · team(7)</text><text x="394" y="128" fill="#7c3aed" font-size="8" font-weight="700">★ request_shutdown · request_plan · review_plan</text><path fill="none" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1" marker-end="url(#arrow)" d="M 734 110 L 748 110 L 748 150 L 55 150 L 55 130"/><rect width="700" height="90" x="30" y="176" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="8"/><text x="380" y="196" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">プロトコル A：shutdown フロー（Lead が開始 → チームメイトが応答）</text><rect width="180" height="46" x="50" y="208" fill="#fff" stroke="#d97706" stroke-width="1" rx="6"/><text x="140" y="226" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">① Lead: request_shutdown</text><text x="140" y="242" fill="#6b7280" font-size="7" text-anchor="middle">new_request_id() → ProtocolState</text><line x1="230" x2="254" y1="231" y2="231" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="46" x="257" y="208" fill="#fff" stroke="#d97706" stroke-width="1" rx="6"/><text x="347" y="226" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">② チームメイト: handle_shutdown</text><text x="347" y="242" fill="#6b7280" font-size="7" text-anchor="middle">ack → shutdown_response</text><line x1="437" x2="461" y1="231" y2="231" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="46" x="464" y="208" fill="#fff" stroke="#d97706" stroke-width="1" rx="6"/><text x="554" y="226" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">③ Lead: consume_lead_inbox</text><text x="554" y="242" fill="#6b7280" font-size="7" text-anchor="middle">match_response(request_id) → ✓</text><rect width="700" height="110" x="30" y="280" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="8"/><text x="380" y="300" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">プロトコル B：plan approval フロー（チームメイトが開始 → Lead が審査）</text><rect width="150" height="46" x="50" y="312" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="6"/><text x="125" y="330" fill="#475569" font-size="8" font-weight="600" text-anchor="middle">0. Lead: request_plan</text><text x="125" y="346" fill="#6b7280" font-size="7" text-anchor="middle">plan_request メッセージ</text><line x1="200" x2="222" y1="335" y2="335" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1" marker-end="url(#arrow)"/><rect width="160" height="46" x="225" y="312" fill="#fff" stroke="#2563eb" stroke-width="1" rx="6"/><text x="305" y="330" fill="#1e40af" font-size="8" font-weight="600" text-anchor="middle">① チームメイト: submit_plan</text><text x="305" y="346" fill="#6b7280" font-size="7" text-anchor="middle">plan_approval_request + request_id</text><line x1="385" x2="407" y1="335" y2="335" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="160" height="46" x="410" y="312" fill="#fff" stroke="#2563eb" stroke-width="1" rx="6"/><text x="490" y="330" fill="#1e40af" font-size="8" font-weight="600" text-anchor="middle">② Lead: review_plan</text><text x="490" y="346" fill="#6b7280" font-size="7" text-anchor="middle">plan_approval_response</text><line x1="570" x2="592" y1="335" y2="335" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="120" height="46" x="595" y="312" fill="#fff" stroke="#2563eb" stroke-width="1" rx="6"/><text x="655" y="330" fill="#1e40af" font-size="8" font-weight="600" text-anchor="middle">③ チームメイト: 受信</text><text x="655" y="346" fill="#6b7280" font-size="7" text-anchor="middle">[Plan approved/rejected]</text><text x="380" y="380" fill="#6b7280" font-size="8" text-anchor="middle">request_plan が要求を送り、submit_plan がレビュー可能な ProtocolState を作る</text><rect width="340" height="85" x="30" y="406" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="8"/><text x="200" y="426" fill="#4c1d95" font-size="10" font-weight="700" text-anchor="middle">状態機械（両プロトコルで共用）</text><rect width="58" height="20" x="55" y="440" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/><text x="84" y="454" fill="#475569" font-size="9" text-anchor="middle">pending</text><line x1="113" x2="192" y1="450" y2="450" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="152" y="445" fill="#16a34a" font-size="8" font-weight="600" text-anchor="middle">approve</text><rect width="62" height="20" x="192" y="440" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="4"/><text x="223" y="454" fill="#166534" font-size="9" text-anchor="middle">approved</text><path fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" d="M 84 460 L 84 478 L 128 478"/><text x="76" y="472" fill="#dc2626" font-size="8" font-weight="600" text-anchor="end">reject</text><rect width="60" height="20" x="128" y="468" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="4"/><text x="158" y="482" fill="#991b1b" font-size="9" text-anchor="middle">rejected</text><rect width="330" height="85" x="400" y="406" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="8"/><text x="565" y="426" fill="#4c1d95" font-size="10" font-weight="700" text-anchor="middle">pending_requests ストレージ</text><text x="420" y="446" fill="#7c3aed" font-size="9">pending_requests: dict[str, ProtocolState]</text><text x="420" y="462" fill="#6b7280" font-size="8">request_id → {type, sender, status, created_at}</text><text x="420" y="478" fill="#6b7280" font-size="8">match_response: request_id でリクエストを検索</text><rect width="700" height="52" x="30" y="506" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/><text x="55" y="524" fill="#1e3a5f" font-size="10" font-weight="600">2つのプロトコル、1つのメカニズム：</text><rect width="130" height="18" x="270" y="512" fill="#fef3c7" stroke="#d97706" stroke-width="1" rx="4"/><text x="335" y="525" fill="#92400e" font-size="9" text-anchor="middle">shutdown_request</text><text x="408" y="525" fill="#475569" font-size="10">と</text><rect width="140" height="18" x="425" y="512" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/><text x="495" y="525" fill="#1e40af" font-size="9" text-anchor="middle">plan_approval_request</text><text x="55" y="548" fill="#6b7280" font-size="8">同じ pending → approved / rejected 状態機械を共有。新しいプロトコルタイプ = 新しい msg_type、新しい状態機械は不要。request_id がリクエストとレスポンスを関連付ける。</text><rect width="700" height="38" x="30" y="570" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="6"/><text x="55" y="588" fill="#166534" font-size="9" font-weight="600">区別：</text><text x="100" y="588" fill="#475569" font-size="9">request_plan は plan_request を送り、submit_plan は request_id を作ってレビューを待つ。</text><text x="55" y="602" fill="#475569" font-size="9">submit_plan がプロトコルエントリポイント（msg_type=&quot;plan_approval_request&quot;）で、チームメイトが自発的に開始し、request_id を pending_requests に書き込む。</text><rect width="700" height="28" x="30" y="622" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/><rect width="12" height="10" x="50" y="632" fill="#f0f4ff" stroke="#2563eb" stroke-width="1" rx="2"/><text x="70" y="642" fill="#475569" font-size="10">Runtime: MessageBus + 永続チームメイト + 自動イベント配信</text><rect width="12" height="10" x="310" y="632" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="2"/><text x="330" y="642" fill="#475569" font-size="10">Protocol: request_id + dispatch + pending_requests + プランゲート</text></svg>