nd_results()</text><text x="408" y="226" fill="#6b7280" font-size="8">完了 → task_notification を messages に追加</text><text x="408" y="240" fill="#6b7280" font-size="8">実行中 → タスク状態を保持</text><path fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" d="M 350 220 L 390 220"/><rect width="680" height="48" x="40" y="274" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/><text x="60" y="296" fill="#1e3a5f" font-size="11" font-weight="600">明示的な指定:</text><rect width="56" height="18" x="155" y="284" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/><text x="183" y="297" fill="#16a34a" font-size="9" text-anchor="middle">false</text><text x="218" y="297" fill="#475569" font-size="9">run_in_background=false · 同期実行</text><rect width="56" height="18" x="360" y="284" fill="#fff7ed" stroke="#ea580c" stroke-width="1" rx="4"/><text x="388" y="297" fill="#ea580c" font-size="9" text-anchor="middle">true</text><text x="423" y="297" fill="#475569" font-size="9">run_in_background=true · バックグラウンド</text><rect width="330" height="84" x="40" y="340" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="6"/><text x="205" y="360" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle">s04 同期実行</text><rect width="80" height="14" x="60" y="370" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="3"/><text x="100" y="381" fill="#1e40af" font-size="8" text-anchor="middle">LLM 呼び出し</text><rect width="160" height="14" x="145" y="370" fill="#fecaca" stroke="#dc2626" stroke-width="1" rx="3"/><text x="225" y="381" fill="#991b1b" font-size="8" text-anchor="middle">bash の結果を待つ</text><rect width="40" height="14" x="310" y="370" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="3"/><text x="330" y="381" fill="#1e40af" font-size="7" text-anchor="middle">次のターン</text><text x="60" y="410" fill="#991b1b" font-size="9">コマンド終了後にループを継続</text><rect width="330" height="84" x="390" y="340" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="6"/><text x="555" y="36